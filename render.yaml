# =============================================================================
# render.yaml — Cosmolyze Render Deployment Configuration
#
# Pure Node.js/Express service — no Python sidecar.
# Image resolution is handled entirely in Node.js (Nykaa API) with
# client-side browser-IP fallback for cache misses.
# =============================================================================

services:
  - type: web
    name: cosmolyze
    runtime: node
    region: oregon

    plan: free

    # ── Build ──────────────────────────────────────────────────────────────────
    buildCommand: npm install

    # ── Start ─────────────────────────────────────────────────────────────────
    startCommand: npm start

    # ── Health Check ──────────────────────────────────────────────────────────
    healthCheckPath: /api

    # ── Environment Variables ─────────────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production
      # The following secrets must be set manually in the Render dashboard.
      # They are listed here for documentation only — values are intentionally
      # omitted so they are never committed to Git.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY_CURRENT
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
